<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Болталка с картинками</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="wrapper">
        <div class="chat-block">
            <h2>Болталка</h2>
            <div id="msgs" class="messages"></div>
            <div class="controls">
                <input type="text" id="msg" placeholder="Напиши что-нибудь...">
                <button onclick="send()">➤</button>
            </div>
        </div>

        <div class="pics-block">
            <h2>Рисовалка</h2> 
            <div class="controls">
                <input type="text" id="txt" placeholder="Опиши картинку...">
                <button onclick="gen()">✨</button>
            </div>
            <div id="img" class="result">
                <img id="pic" style="display: none;">
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
